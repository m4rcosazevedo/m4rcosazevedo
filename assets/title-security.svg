<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Segurança desde a primeira linha"><title>Segurança desde a primeira linha</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06050D"/><stop offset="1" stop-color="#140B26"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern><filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5C8A"/><stop offset=".33" stop-color="#FFB347"/><stop offset=".66" stop-color="#4FD8FF"/><stop offset="1" stop-color="#A06BFF"/></linearGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="rr"><rect width="1200" height="120" rx="20"/></clipPath></defs><style>@keyframes sc2{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}.sw{animation:sc2 4.5s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#rr)"><rect width="1200" height="120" fill="url(#bg)"/><text x="48" y="60" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="#F2EEFF">Segurança desde a primeira linha</text><text x="48" y="90" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#9A92B8">Não é um recurso a mais, é critério de entrega.</text><rect x="0" y="108" widt