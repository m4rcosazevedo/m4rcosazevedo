ation:sca 5s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#rr)"><rect width="1200" height="208" fill="url(#bg)"/><ellipse cx="110" cy="104.0" rx="160" ry="130" fill="url(#hs)"/><g transform="translate(110 90.0) scale(.6)"><circle class="rg" r="92" fill="none" stroke="#5CFFB1" stroke-width="2.5"/><circle class="rg rg2" r="92" fill="none" stroke="#5CFFB1" stroke-width="2.5"/><path d="M0 -78L62 -54V12C62 56 26 80 0 92C-26 80 -62 56 -62 12V-54Z" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-width="4" stroke-linejoin="round" filter="url(#gl)"/><path class="tk" style="animation-delay:.3s" d="M-24 4L-6 22L28 -18" fill="none" stroke="#F2EEFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/></g><text x="110" y="170.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#9A92B8">minhacolecao.app</text><path d="M216 20V192" stroke="#5CFFB1" stroke-opacity=".18"/><g><circle cx="258" cy="52" r="14" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:0.5s" d="M252 52L256.5 56.5L265 47" fill="none" stroke="#5CFFB1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:0.5s" x="282" y="50" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#F2EEFF">HTTPS obrigatório</text><text class="fd" style="animation-delay:0.5s" x="282" y="70" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#9A92B8">HSTS por 1 ano</text></g><g><circle cx="490" cy="52" r="14" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:0.75s" d="M484 52L488.5 56.5L497 47" fill="none" stroke="#5CFFB1" stroke-width="2.4" stroke-linecap="round" stroke-linejoi