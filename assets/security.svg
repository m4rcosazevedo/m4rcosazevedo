<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Painel de segurança de minhacolecao.app: HTTPS obrigatório, política de conteúdo restrita, proteção contra clickjacking, permissões mínimas e outras verificações de cabeçalhos HTTP"><title>Painel de segurança de minhacolecao.app: HTTPS obrigatório, política de conteúdo restrita, proteção contra clickjacking, permissões mínimas e outras verificações de cabeçalhos HTTP</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06050D"/><stop offset="1" stop-color="#140B26"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern><filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter><radialGradient id="hs"><stop offset="0" stop-color="#5CFFB1" stop-opacity=".16"/><stop offset="1" stop-color="#5CFFB1" stop-opacity="0"/></radialGradient><linearGradient id="sl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CFFB1" stop-opacity="0"/><stop offset=".5" stop-color="#5CFFB1" stop-opacity=".7"/><stop offset="1" stop-color="#5CFFB1" stop-opacity="0"/></linearGradient><clipPath id="rr"><rect width="1200" height="490" rx="20"/></clipPath></defs><style>@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}.rg{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}.rg2{animation-delay:1.6s}@keyframes tick{from{stroke-dashoffset:90}to{stroke-dashoffset:0}}.tk{stroke-dasharray:90;animation:tick .5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.fd{animation:fade .5s ease-out both}@keyframes sca{from{transform:translateY(0)}to{transform:translateY(336px)}}.sa{animation:sca 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#rr)"><rect width="1200" height="490" fill="url(#bg)"/><ellipse cx="190" cy="196" rx="220" ry="200" fill="url(#hs)"/><g transform="translate(190 172)"><circle class="rg" r="92" fill="none" stroke="#5CFFB1" stroke-width="2"/><circle class="rg rg2" r="92" fill="none" stroke="#5CFFB1" stroke-width="2"/><path d="M0 -78L62 -54V12C62 56 26 80 0 92C-26 80 -62 56 -62 12V-54Z" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-width="3" stroke-linejoin="round" filter="url(#gl)"/><path d="M0 -62L48 -44V10C48 44 20 62 0 72C-20 62 -48 44 -48 10V-44Z" fill="none" stroke="#5CFFB1" stroke-opacity=".35"/><path class="tk" style="animation-delay:.3s" d="M-24 4L-6 22L28 -18" fill="none" stroke="#F2EEFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/></g><text x="190" y="352" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#F2EEFF">minhacolecao.app</text><text x="190" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9A92B8">cabeçalhos HTTP reais, 03/11/2026</text><path d="M388 22V358" stroke="#5CFFB1" stroke-opacity=".18"/><g><circle cx="436" cy="50" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:0.5s" d="M429 50L434 55L444 44" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:0.5s" x="462" y="48" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">HTTPS obrigatório</text><text class="fd" style="animation-delay:0.5s" x="462" y="69" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">HSTS por 1 ano, incluindo subdomínios.</text></g><g><circle cx="436" cy="134" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:0.78s" d="M429 134L434 139L444 128" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:0.78s" x="462" y="132" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Política de conteúdo restrita</text><text class="fd" style="animation-delay:0.78s" x="462" y="153" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">CSP: só scripts do próprio site e do</text><text class="fd" style="animation-delay:0.78s" x="462" y="171" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">login Google.</text></g><g><circle cx="436" cy="218" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:1.06s" d="M429 218L434 223L444 212" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:1.06s" x="462" y="216" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Sem plugins nem objetos</text><text class="fd" style="animation-delay:1.06s" x="462" y="237" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">object-src none. Base e formulários só</text><text class="fd" style="animation-delay:1.06s" x="462" y="255" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">do próprio site.</text></g><g><circle cx="436" cy="302" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:1.34s" d="M429 302L434 307L444 296" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:1.34s" x="462" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Contra clickjacking</text><text class="fd" style="animation-delay:1.34s" x="462" y="321" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">frame-ancestors e X-Frame-Options no</text><text class="fd" style="animation-delay:1.34s" x="462" y="339" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">próprio site.</text></g><g><circle cx="828" cy="50" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:1.62s" d="M821 50L826 55L836 44" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:1.62s" x="854" y="48" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Tipo de conteúdo travado</text><text class="fd" style="animation-delay:1.62s" x="854" y="69" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">nosniff: o navegador não adivinha o</text><text class="fd" style="animation-delay:1.62s" x="854" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">formato.</text></g><g><circle cx="828" cy="134" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:1.9000000000000001s" d="M821 134L826 139L836 128" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:1.9000000000000001s" x="854" y="132" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Privacidade na navegação</text><text class="fd" style="animation-delay:1.9000000000000001s" x="854" y="153" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">Referrer-Policy: strict-origin-when-</text><text class="fd" style="animation-delay:1.9000000000000001s" x="854" y="171" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">cross-origin.</text></g><g><circle cx="828" cy="218" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:2.18s" d="M821 218L826 223L836 212" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:2.18s" x="854" y="216" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Permissões mínimas</text><text class="fd" style="animation-delay:2.18s" x="854" y="237" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">Microfone, localização e pagamento</text><text class="fd" style="animation-delay:2.18s" x="854" y="255" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">desligados.</text></g><g><circle cx="828" cy="302" r="15" fill="#5CFFB1" fill-opacity=".1" stroke="#5CFFB1" stroke-opacity=".7"/><path class="tk" style="animation-delay:2.46s" d="M821 302L826 307L836 296" fill="none" stroke="#5CFFB1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/><text class="fd" style="animation-delay:2.46s" x="854" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Página sem cache</text><text class="fd" style="animation-delay:2.46s" x="854" y="321" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">no-store: nada fica guardado no</text><text class="fd" style="animation-delay:2.46s" x="854" y="339" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">navegador.</text></g><rect class="sa" x="400" y="20" width="780" height="3" fill="url(#sl)" filter="url(#gl)"/><rect x="32" y="386" width="1136" height="1" fill="#5CFFB1" fill-opacity=".25"/><rect x="48" y="414" width="8" height="8" fill="#5CFFB1" filter="url(#gl)"/><text x="66" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Pensar como atacante</text><text x="66" y="446" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">antes de dar algo como pronto.</text><rect x="428" y="414" width="8" height="8" fill="#5CFFB1" filter="url(#gl)"/><text x="446" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Nunca confiar na entrada</text><text x="446" y="446" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">parâmetros, arquivos e URLs são hostis</text><text x="446" y="464" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">até provar o contrário.</text><rect x="808" y="414" width="8" height="8" fill="#5CFFB1" filter="url(#gl)"/><text x="826" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#F2EEFF">Dependência nova</text><text x="826" y="446" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9A92B8">é risco novo, e passa por análise.</text><rect width="1200" height="490" fill="url(#scan)"/></g><g fill="none" stroke="#F2EEFF" stroke-opacity="0.35" stroke-width="1.5"><path d="M18 44V18H44"/><path d="M1156 18H1182V44"/><path d="M18 446V472H44"/><path d="M1156 472H1182V446"/></g></svg>