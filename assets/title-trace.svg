<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="116" viewBox="0 0 1200 116" role="img" aria-label="Uma requisição, ponta a ponta"><title>Uma requisição, ponta a ponta</title><defs></defs><rect width="1200" height="116" rx="20" fill="#15111F"/><text x="48" y="58" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="700" fill="#F4F0FF">Uma requisição, ponta a ponta</text><text x="48" y="88" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#A79FC0">Do clique até o dado, e de volta. Cada camada entra no seu tempo.</text><rect x="976" y="46" width="40" height="5" rx="2.5" fill="#FF7A90"/><rect x="1020" y="46" width="40" height="5" rx="2.5" fill="#FFB86B"/><rect x="1064" y="46" width="40" height="5" rx="2.5" fill="#7BD8FF"/><rect x="1108" y="46" width="40" height="5" rx="2.5" fill="#A78BFA"/></svg>